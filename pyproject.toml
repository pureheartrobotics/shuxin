[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shuxin-agent"
version = "0.1.0"
description = "初心 (ChuXin) — 陪伴型 AI 智能体框架，拥有独立灵魂的 AI 伴侣"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ChuXin Team" }]
license = "MIT"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "jinja2>=3.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.3.0"]
anthropic = ["anthropic>=0.30.0"]
web = ["fastapi>=0.110.0", "uvicorn>=0.27.0"]
voice = ["edge-tts>=6.0.0", "websockets>=13.0"]

[project.scripts]
shuxin = "shuxin.cli.main:cli_entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
