services:
  postgres:
    image: postgres:16-alpine
    container_name: shuxin-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shuxin}
      POSTGRES_USER: ${POSTGRES_USER:-shuxin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shuxin_dev_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - shuxin_postgres_data:/var/lib/postgresql/data
    networks:
      - shuxin_backend

  qdrant:
    image: qdrant/qdrant:v1.12.6
    container_name: shuxin-qdrant
    volumes:
      - shuxin_qdrant_data:/qdrant/storage
    healthcheck:
      # qdrant/qdrant 镜像无 wget/curl；用 bash /dev/tcp 探测 /readyz
      test:
        - CMD-SHELL
        - >
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333
          && printf "GET /readyz HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n" >&3
          && head -c 256 <&3 | grep -q "all shards are ready"'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # 本地默认 6335 避免与本机已有 Qdrant(6333) 冲突；生产部署见 docs/DEPLOY_SERVER.md
    ports:
      - "${QDRANT_HTTP_PORT:-6335}:6333"
    networks:
      - shuxin_backend

  shuxin-voice-demo:
    build:
      context: .
      dockerfile: Dockerfile
    image: shuxin-voice-demo:latest
    container_name: shuxin-voice-demo-pg
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      SHUXIN_HOME: /app/data/shuxin_home
      VOICE_DEVICE_CONFIG: /app/data/devices.yaml
      SHUXIN_USERS_CONFIG: /app/data/users.yaml
      DATABASE_URL: postgresql://${POSTGRES_USER:-shuxin}:${POSTGRES_PASSWORD:-shuxin_dev_password}@postgres:5432/${POSTGRES_DB:-shuxin}
      SHUXIN_DB_POOL_MIN: ${SHUXIN_DB_POOL_MIN:-1}
      SHUXIN_DB_POOL_MAX: ${SHUXIN_DB_POOL_MAX:-10}
      SHUXIN_LLM_TIMEOUT_SECONDS: ${SHUXIN_LLM_TIMEOUT_SECONDS:-60}
      SHUXIN_LLM_CONNECT_TIMEOUT_SECONDS: ${SHUXIN_LLM_CONNECT_TIMEOUT_SECONDS:-5}
      SHUXIN_ADMIN_TOKEN: ${SHUXIN_ADMIN_TOKEN:-dev-admin-token}
      SHUXIN_DEVICE_SHARED_SECRET: ${SHUXIN_DEVICE_SHARED_SECRET:-dev-device-secret}
      SHUXIN_DEVICE_SECRET_ENCRYPTION_KEY: ${SHUXIN_DEVICE_SECRET_ENCRYPTION_KEY:-}
      SHUXIN_WECHAT_MOCK: ${SHUXIN_WECHAT_MOCK:-1}
      SHUXIN_WECHAT_APPID: ${SHUXIN_WECHAT_APPID:-}
      SHUXIN_WECHAT_SECRET: ${SHUXIN_WECHAT_SECRET:-}
      DEMO_LLM_PROVIDER: ${DEMO_LLM_PROVIDER:-openai-compatible}
      DEMO_LLM_MODEL: ${DEMO_LLM_MODEL:-deepseek-chat}
      DEMO_LLM_BASE_URL: ${DEMO_LLM_BASE_URL:-}
      DEMO_LLM_API_KEY: ${DEMO_LLM_API_KEY:-}
      SHUXIN_TTS_EFFECT: ${SHUXIN_TTS_EFFECT:-karen}
      TENCENT_ASR_APPID: ${TENCENT_ASR_APPID:-}
      TENCENTCLOUD_SECRET_ID: ${TENCENTCLOUD_SECRET_ID:-}
      TENCENTCLOUD_SECRET_KEY: ${TENCENTCLOUD_SECRET_KEY:-}
      SHUXIN_MEM0_ENABLED: ${SHUXIN_MEM0_ENABLED:-1}
      SHUXIN_QDRANT_HOST: ${SHUXIN_QDRANT_HOST:-qdrant}
      SHUXIN_QDRANT_PORT: ${SHUXIN_QDRANT_PORT:-6333}
      SHUXIN_QDRANT_COLLECTION: ${SHUXIN_QDRANT_COLLECTION:-shuxin_memories}
      SHUXIN_QDRANT_API_KEY: ${SHUXIN_QDRANT_API_KEY:-}
      SHUXIN_EMBED_MODEL: ${SHUXIN_EMBED_MODEL:-text-embedding-3-small}
      SHUXIN_EMBED_DIMS: ${SHUXIN_EMBED_DIMS:-1536}
      SHUXIN_MEM0_SEARCH_TOP_K: ${SHUXIN_MEM0_SEARCH_TOP_K:-5}
    ports:
      - "${VOICE_DEMO_PORT:-8765}:8765"
    volumes:
      - ./src:/app/src
      # 挂载脚本目录，便于容器内下载/更新语音模型。
      - ./scripts:/app/scripts
      - ./data:/app/data
      - ./models:/app/models
      - ./samples:/app/samples
      - ./outputs:/app/outputs
    working_dir: /app
    command: ["python", "-m", "shuxin.voice.server", "--host", "0.0.0.0", "--port", "8765"]
    networks:
      - shuxin_backend

volumes:
  shuxin_postgres_data:
  shuxin_qdrant_data:

networks:
  shuxin_backend:
